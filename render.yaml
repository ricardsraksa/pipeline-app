services:
  - type: web
    name: pipeline-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PIPELINE_PASSWORD
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_PRODUCTS_FOLDER_ID
        sync: false
      - key: HIGGSFIELD_API_KEY
        sync: false
