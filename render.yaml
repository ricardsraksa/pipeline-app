services:
  - type: web
    name: pipeline-app
    # Docker: Stage 1 runs a Python scraper with a real Chromium (see Dockerfile).
    # The browser path needs ~1GB, so the plan must be Standard (2GB) or larger.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    numInstances: 1
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      # Auth gate — the app returns 503 until this is set
      - key: PIPELINE_PASSWORD
        sync: false
      # Anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # Turso (runs DB)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Cloudflare R2 (source + generated images)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Higgsfield MCP (image generation)
      - key: HIGGSFIELD_MCP_CLIENT_ID
        sync: false
      - key: HIGGSFIELD_MCP_REFRESH_TOKEN
        sync: false
      # Shopify (Dev Dashboard app, client-credentials grant)
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      # Google (service account) — master doc + Drive product folders
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_MASTER_DOC_ID
        sync: false
      - key: GOOGLE_DRIVE_PRODUCTS_FOLDER_ID
        sync: false
