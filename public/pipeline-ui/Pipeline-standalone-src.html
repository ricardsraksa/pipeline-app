<!DOCTYPE html>
<html lang="en" data-theme="light" data-dir="signal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline — DTC Research</title>

  <template id="__bundler_thumbnail" data-bg-color="#0a0c10">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#0a0c10"/>
      <g transform="translate(488 300)">
        <rect x="0" y="0" width="90" height="200" rx="14" fill="#e8eaf1"/>
        <rect x="112" y="0" width="112" height="200" rx="14" fill="#e8eaf1" opacity="0.45"/>
      </g>
      <g transform="translate(420 560)" fill="none" stroke="#646b78" stroke-width="8">
        <circle cx="30" cy="20" r="20" fill="#43c98a" stroke="none"/>
        <line x1="58" y1="20" x2="150" y2="20"/>
        <circle cx="180" cy="20" r="20"/>
        <line x1="208" y1="20" x2="300" y2="20"/>
        <circle cx="330" cy="20" r="20"/>
      </g>
    </svg>
  </template>

  <!-- Fonts: fresh pairings, one set covers all three directions -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Spline+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind runtime build (offline-inlinable; Play CDN successor) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="stylesheet" href="styles.css" />
  <style>
    /* keep Tailwind's preflight from fighting our font tokens */
    body { font-family: var(--font-ui); }
    #root { min-height: 100vh; }
    /* loading splash */
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--color-bg); z-index: 200; transition: opacity .3s ease; }
    #boot.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot"><div style="display:flex;align-items:center;gap:10px;color:var(--color-text-3);font-family:var(--font-mono);font-size:12px"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-accent)" class="pulse-dot"></span>Loading Pipeline…</div></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="engine.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="rundetail.jsx"></script>
  <script type="text/babel" src="stage3.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    // hide splash once React has mounted
    const obs = new MutationObserver(() => {
      if (document.getElementById("root").childElementCount > 0) {
        document.getElementById("boot").classList.add("hide");
        obs.disconnect();
        setTimeout(() => document.getElementById("boot")?.remove(), 400);
      }
    });
    obs.observe(document.getElementById("root"), { childList: true });
  </script>
</body>
</html>
